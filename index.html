<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonics Game - Dd & Ee Letter Recognition</title>
    <!-- Google Fonts: Balsamiq Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Balsamiq Sans"', 'cursive', 'sans-serif'],
                    },
                    colors: {
                        brandYellow: '#FFD166',
                        brandGreen: '#06D6A0',
                        brandBlue: '#118AB2',
                        brandRed: '#EF476F',
                        brandDark: '#073B4C'
                    }
                }
            }
        }
    </script>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            touch-action: manipulation;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Balsamiq Sans', cursive, sans-serif;
            background-color: #073B4C;
        }

        .screen-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Screen Background Image Styles */
        .bg-full-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .content-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            box-sizing: border-box;
        }

        /* Fullscreen button */
        .fullscreen-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            z-index: 50;
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #073B4C;
            border-radius: 9999px;
            padding: 0.75rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, background 0.2s ease;
        }

        .fullscreen-btn:active {
            transform: scale(0.92);
        }

        /* Pulse / Hover Animation for Buttons */
        .btn-bounce {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn-bounce:active {
            transform: scale(0.95) !important;
        }

        /* Answer Card Base */
        .choice-card {
            background: rgba(255, 255, 255, 0.92);
            border: 6px solid #118AB2;
            border-radius: 2rem;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            transition: all 0.2s ease;
            width: 42%;
            max-width: 360px;
            height: 65%;
            max-height: 400px;
        }

        @media (hover: hover) {
            .choice-card:hover {
                transform: translateY(-5px);
                border-color: #FFD166;
                box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            }
        }

        .choice-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        /* Feedback Animations */
        .correct-animate {
            animation: correctPulse 0.6s ease forwards;
            border-color: #06D6A0 !important;
            background: rgba(209, 250, 229, 0.95) !important;
        }

        .incorrect-animate {
            animation: incorrectShake 0.5s ease forwards;
            border-color: #EF476F !important;
            background: rgba(254, 226, 226, 0.95) !important;
        }

        @keyframes correctPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @keyframes incorrectShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-15px); }
            40%, 80% { transform: translateX(15px); }
        }

        /* Glassmorphism HUD Panels */
        .hud-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 4px solid #073B4C;
            border-radius: 1.5rem;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="font-sans text-brandDark">

    <div class="screen-container">

        <!-- Maximize Screen / Fullscreen Button (Only Icon) -->
        <button id="fullscreenBtn" class="fullscreen-btn" aria-label="Toggle Fullscreen">
            <svg id="fullscreenIcon" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-brandDark" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
            </svg>
        </button>

        <!-- ================= HOME SCREEN ================= -->
        <div id="homeScreen" class="absolute inset-0 w-full h-full flex flex-col justify-center items-center z-20">
            <!-- Background Image -->
            <img src="homescreen.png" alt="Home Screen Background" class="bg-full-image" onerror="this.style.display='none'; document.getElementById('homeScreen').classList.add('bg-gradient-to-b', 'from-brandBlue', 'to-brandDark');">
            
            <div class="content-layer justify-end pb-12 sm:pb-16 md:pb-20">
                <!-- Start Game Button -->
                <button id="startBtn" class="btn-bounce bg-brandYellow hover:bg-yellow-400 text-brandDark font-extrabold text-3xl sm:text-5xl md:text-6xl px-10 py-5 sm:px-16 sm:py-8 rounded-full border-8 border-brandDark shadow-2xl cursor-pointer tracking-wider flex items-center gap-4 transform hover:scale-105 transition-all">
                    <span>START GAME</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 sm:h-14 sm:w-14" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- ================= GAMEPLAY SCREEN ================= -->
        <div id="gameScreen" class="absolute inset-0 w-full h-full hidden flex-col justify-between z-20">
            <!-- Background Image -->
            <img src="gamescreen.png" alt="Game Screen Background" class="bg-full-image" onerror="this.style.display='none'; document.getElementById('gameScreen').classList.add('bg-gradient-to-b', 'from-sky-300', 'to-indigo-900');">

            <div class="content-layer">
                <!-- Top HUD Header: Score & Timer -->
                <div class="w-full flex justify-between items-center max-w-5xl px-2 pt-2">
                    <!-- Score Counter -->
                    <div class="hud-panel px-6 py-3 flex items-center space-x-3">
                        <span class="text-2xl sm:text-3xl md:text-4xl font-black text-brandBlue uppercase tracking-wider">Score:</span>
                        <span id="scoreDisplay" class="text-3xl sm:text-4xl md:text-5xl font-black text-brandRed">0</span>
                    </div>

                    <!-- Countdown Timer -->
                    <div class="hud-panel px-6 py-3 flex items-center space-x-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-brandYellow" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span id="timerDisplay" class="text-3xl sm:text-4xl md:text-5xl font-black text-brandDark">60s</span>
                    </div>
                </div>

                <!-- Main Interactive Play Area -->
                <div class="w-full max-w-5xl flex-1 flex flex-col justify-center items-center my-2 my-md-4">
                    
                    <!-- Repeat Audio Button (Large & Centered) -->
                    <button id="repeatAudioBtn" class="btn-bounce bg-brandYellow hover:bg-yellow-300 text-brandDark font-extrabold text-xl sm:text-2xl md:text-3xl px-8 py-4 sm:px-10 sm:py-5 rounded-3xl border-4 border-brandDark shadow-xl cursor-pointer flex items-center gap-3 mb-6 transform hover:scale-105 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 sm:h-10 sm:w-10 text-brandDark" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15.536a5 5 0 001.414 1.414m2.828-9.9a9 9 0 0112.728 0M12 6v12m0-12L8 10H4v4h4l4 4" />
                        </svg>
                        <span>Repeat Audio</span>
                    </button>

                    <!-- Answer Choices Cards Container (Dd & Ee) -->
                    <div class="w-full flex justify-center items-center space-x-6 sm:space-x-12 h-64 sm:h-80 md:h-96">
                        <!-- Choice Dd Card -->
                        <div id="choiceDd" class="choice-card" role="button" tabindex="0" aria-label="Letter Choice Dd">
                            <img src="Dd.png" alt="Dd" onerror="this.onerror=null; this.src='https://placehold.co/300x400/FFD166/073B4C?text=Dd';">
                        </div>

                        <!-- Choice Ee Card -->
                        <div id="choiceEe" class="choice-card" role="button" tabindex="0" aria-label="Letter Choice Ee">
                            <img src="Ee.png" alt="Ee" onerror="this.onerror=null; this.src='https://placehold.co/300x400/06D6A0/073B4C?text=Ee';">
                        </div>
                    </div>

                </div>

                <!-- Bottom Placeholder for Balance -->
                <div class="h-6"></div>
            </div>
        </div>

        <!-- ================= GAME OVER SCREEN ================= -->
        <div id="gameOverScreen" class="absolute inset-0 w-full h-full hidden flex-col justify-center items-center z-30 bg-brandDark bg-opacity-95 p-6">
            <div class="hud-panel p-8 sm:p-12 md:p-16 max-w-2xl w-full flex flex-col items-center text-center space-y-6 sm:space-y-8 border-8 border-brandYellow shadow-2xl">
                <h1 class="text-5xl sm:text-6xl md:text-7xl font-black text-brandRed uppercase tracking-wide">TIME'S UP!</h1>
                
                <div class="text-2xl sm:text-3xl md:text-4xl font-bold text-brandDark">
                    Your Final Score: 
                    <span id="finalScoreDisplay" class="text-4xl sm:text-5xl md:text-6xl font-black text-brandBlue block mt-2">0</span>
                </div>

                <!-- Play Again Button -->
                <button id="playAgainBtn" class="btn-bounce bg-brandGreen hover:bg-emerald-400 text-white font-extrabold text-2xl sm:text-4xl px-10 py-5 rounded-full border-6 border-brandDark shadow-xl cursor-pointer transform hover:scale-105 transition-all flex items-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 sm:h-10 sm:w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span>PLAY AGAIN</span>
                </button>
            </div>
        </div>

    </div>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        // Vocabulary Dataset
        const VOCAB_DATA = [
            { id: 'dog', word: 'dog', audioSrc: 'dog.mp3', letter: 'Dd' },
            { id: 'dad', word: 'dad', audioSrc: 'dad.mp3', letter: 'Dd' },
            { id: 'donut', word: 'donut', audioSrc: 'donut.mp3', letter: 'Dd' },
            { id: 'egg', word: 'egg', audioSrc: 'egg.mp3', letter: 'Ee' },
            { id: 'elbow', word: 'elbow', audioSrc: 'elbow.mp3', letter: 'Ee' },
            { id: 'elephant', word: 'elephant', audioSrc: 'elephant.mp3', letter: 'Ee' }
        ];

        // Game State Variables
        let currentQuestion = null;
        let lastVocabularyId = null;
        let score = 0;
        let timeRemaining = 60;
        let timerInterval = null;
        let isProcessingAnswer = false;
        let isGameActive = false;

        // Audio Objects
        let currentVocabAudio = null;
        let bgMusic = null;
        let audioContext = null;

        // DOM Elements
        const homeScreen = document.getElementById('homeScreen');
        const gameScreen = document.getElementById('gameScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');

        const startBtn = document.getElementById('startBtn');
        const repeatAudioBtn = document.getElementById('repeatAudioBtn');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        const choiceDd = document.getElementById('choiceDd');
        const choiceEe = document.getElementById('choiceEe');

        const scoreDisplay = document.getElementById('scoreDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const finalScoreDisplay = document.getElementById('finalScoreDisplay');

        // Web Audio API Synthesizer for Chime & Buzz SFX
        function initAudioContext() {
            if (!audioContext) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) {
                    audioContext = new AudioCtx();
                }
            }
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        // Web Audio SFX - Correct Chime
        function playCorrectSFX() {
            if (!audioContext) return;
            const now = audioContext.currentTime;
            
            const osc1 = audioContext.createOscillator();
            const osc2 = audioContext.createOscillator();
            const gain = audioContext.createGain();

            osc1.type = 'sine';
            osc2.type = 'sine';

            // High double-tone chime (E5 -> A5)
            osc1.frequency.setValueAtTime(659.25, now);
            osc1.frequency.setValueAtTime(880.00, now + 0.12);

            osc2.frequency.setValueAtTime(1318.51, now);
            osc2.frequency.setValueAtTime(1760.00, now + 0.12);

            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(audioContext.destination);

            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + 0.5);
            osc2.stop(now + 0.5);
        }

        // Web Audio SFX - Incorrect Buzz
        function playIncorrectSFX() {
            if (!audioContext) return;
            const now = audioContext.currentTime;

            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.linearRampToValueAtTime(110, now + 0.25);

            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

            osc.connect(gain);
            gain.connect(audioContext.destination);

            osc.start(now);
            osc.stop(now + 0.3);
        }

        // Background Music Initialization
        function initBackgroundMusic() {
            if (!bgMusic) {
                bgMusic = new Audio('bgm.mp3');
                bgMusic.loop = true;
                bgMusic.volume = 0.10; // Exactly 10% volume

                // Fallback synthesized silent/loop handle if bgm.mp3 is missing or blocked
                bgMusic.onerror = () => {
                    console.log("Background music file not found or blocked. Game plays without BGM.");
                };
            }
        }

        function playBGM() {
            if (bgMusic) {
                bgMusic.volume = 0.10;
                bgMusic.play().catch(() => {
                    // Autoplay blocked handling
                });
            }
        }

        function duckBGM() {
            if (bgMusic && !bgMusic.paused) {
                bgMusic.volume = 0.02; // Temporarily lower BGM during voice/effects
            }
        }

        function restoreBGM() {
            if (bgMusic && !bgMusic.paused) {
                bgMusic.volume = 0.10; // Restore to 10%
            }
        }

        function stopBGM() {
            if (bgMusic) {
                bgMusic.pause();
                bgMusic.currentTime = 0;
            }
        }

        // Play Vocabulary Audio (with Audio Priority ducking BGM)
        function playVocabAudio(audioSrc, callback) {
            // Stop existing vocab audio if playing
            if (currentVocabAudio) {
                currentVocabAudio.pause();
                currentVocabAudio.currentTime = 0;
            }

            duckBGM();

            currentVocabAudio = new Audio(audioSrc);
            
            currentVocabAudio.onended = () => {
                restoreBGM();
                if (callback) callback();
            };

            currentVocabAudio.onerror = () => {
                console.warn(`Audio file ${audioSrc} could not be loaded.`);
                restoreBGM();
                if (callback) callback();
            };

            currentVocabAudio.play().catch(err => {
                console.warn("Vocab play error:", err);
                restoreBGM();
                if (callback) callback();
            });
        }

        // Question Selection (No immediate repetition logic)
        function getNextQuestion() {
            let availableWords = VOCAB_DATA;
            if (lastVocabularyId !== null && VOCAB_DATA.length > 1) {
                availableWords = VOCAB_DATA.filter(item => item.id !== lastVocabularyId);
            }
            
            const randomIndex = Math.floor(Math.random() * availableWords.length);
            const selected = availableWords[randomIndex];
            
            lastVocabularyId = selected.id;
            return selected;
        }

        // Load Next Question
        function loadNextQuestion() {
            if (!isGameActive) return;

            isProcessingAnswer = false;
            clearChoiceFeedback();

            currentQuestion = getNextQuestion();
            
            // Play corresponding audio immediately when question appears
            playVocabAudio(currentQuestion.audioSrc);
        }

        // Feedback styling cleanup
        function clearChoiceFeedback() {
            choiceDd.classList.remove('correct-animate', 'incorrect-animate');
            choiceEe.classList.remove('correct-animate', 'incorrect-animate');
        }

        // Handle Answer Click/Tap
        function handleAnswer(selectedLetter, element) {
            if (!isGameActive || isProcessingAnswer) return;

            isProcessingAnswer = true; // Lock interactions during feedback

            if (selectedLetter === currentQuestion.letter) {
                // CORRECT ANSWER
                score += 1;
                scoreDisplay.textContent = score;

                element.classList.add('correct-animate');
                duckBGM();
                playCorrectSFX();

                // Proceed to next question after short feedback delay
                setTimeout(() => {
                    restoreBGM();
                    loadNextQuestion();
                }, 1000);

            } else {
                // INCORRECT ANSWER
                element.classList.add('incorrect-animate');
                duckBGM();
                playIncorrectSFX();

                // Allow retry on same question after brief feedback
                setTimeout(() => {
                    element.classList.remove('incorrect-animate');
                    restoreBGM();
                    isProcessingAnswer = false; // Allow trying again on same question
                }, 600);
            }
        }

        // Timer Logic
        function startTimer() {
            clearInterval(timerInterval);
            timeRemaining = 60;
            timerDisplay.textContent = `${timeRemaining}s`;

            timerInterval = setInterval(() => {
                timeRemaining--;
                timerDisplay.textContent = `${timeRemaining}s`;

                if (timeRemaining <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // Start Game Round
        function startGame() {
            initAudioContext();
            initBackgroundMusic();

            score = 0;
            lastVocabularyId = null;
            scoreDisplay.textContent = score;

            homeScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            gameScreen.classList.add('flex');

            isGameActive = true;
            playBGM();
            startTimer();
            loadNextQuestion();
        }

        // End Game / Game Over
        function endGame() {
            isGameActive = false;
            clearInterval(timerInterval);

            // Stop all audio
            if (currentVocabAudio) {
                currentVocabAudio.pause();
                currentVocabAudio.currentTime = 0;
            }
            stopBGM();

            finalScoreDisplay.textContent = score;

            gameScreen.classList.add('hidden');
            gameScreen.classList.remove('flex');
            gameOverScreen.classList.remove('hidden');
            gameOverScreen.classList.add('flex');
        }

        // Fullscreen Toggle
        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        // Event Listeners
        startBtn.addEventListener('click', startGame);

        playAgainBtn.addEventListener('click', () => {
            startGame();
        });

        repeatAudioBtn.addEventListener('click', () => {
            if (isGameActive && currentQuestion && !isProcessingAnswer) {
                playVocabAudio(currentQuestion.audioSrc);
            }
        });

        choiceDd.addEventListener('click', () => handleAnswer('Dd', choiceDd));
        choiceEe.addEventListener('click', () => handleAnswer('Ee', choiceEe));

        fullscreenBtn.addEventListener('click', toggleFullscreen);

        // Keyboard Support for SmartBoard / Accessibility
        document.addEventListener('keydown', (e) => {
            if (!isGameActive) return;
            if (e.key === 'd' || e.key === 'D') {
                handleAnswer('Dd', choiceDd);
            } else if (e.key === 'e' || e.key === 'E') {
                handleAnswer('Ee', choiceEe);
            } else if (e.key === ' ') {
                if (currentQuestion && !isProcessingAnswer) {
                    playVocabAudio(currentQuestion.audioSrc);
                }
            }
        });
    </script>
</body>
</html>
